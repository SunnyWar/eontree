[package]
name = "eontree-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
eontree-core = { version = "0.1.0", path = "../eontree-core" }
clap = {version = "4.6.7", features = ["derive"]}
ed25519-dalek = {version = "3.0.0", features = ["rand_core"]}
getrandom = {version = "0.4.3", features = ["std", "sys_rng"]}
hex = "0.4.3"
reqwest = {version = "0.13.5", features = ["json"]}
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
tokio = {version = "1.54.1", features = ["full"]}
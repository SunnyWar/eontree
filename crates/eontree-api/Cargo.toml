[package]
name = "eontree-api"
version = "0.1.0"
edition = "2024"

[dependencies]
eontree-core = { path = "../eontree-core" }
eontree-jury = { path = "../eontree-jury" }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
